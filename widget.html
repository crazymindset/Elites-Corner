<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html,
body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    height: 230px !important;
    min-height: 230px !important;
    background: #312e2b !important;
    background-color: #312e2b !important;
    overflow: hidden !important;
    display: flex !important;
    align-items: flex-start !important;
    justify-content: center !important;
}

* {
    box-sizing: border-box;
}

#eliteCard {
    width: 100% !important;
    max-width: 250px !important;
    height: 250px !important;
    min-height: 205px !important;
    margin: 8px auto 0 auto !important;
    padding: 12px !important;
    background: #262522 !important;
    overflow: hidden !important;
}
</style>
</head>

<body>

<div id="eliteCard"
style="
position:relative;
transition:0.4s cubic-bezier(0.175,0.885,0.32,1.275);
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
font-size:16px;
border:1px solid #000000;
border-radius:22px;
padding:12px;
width:250px;
height:205px;
max-width:250px;
margin:0 auto;
box-shadow:0 0 15px #00ffff;
transform:scale(1);
overflow:hidden;
">

<div id="glassGlowLayer"
style="
position:absolute;
inset:0;
z-index:0;
overflow:hidden;
border-radius:22px;
pointer-events:none;
"></div>

<audio
style="display:none;"
id="eliteAudioPlayer"
preload="none"
data-idx="0">
</audio>

<div style="position:relative;z-index:2;">

<div style="width:100%;overflow:hidden;text-align:center;">
<marquee
behavior="alternate"
direction="left"
scrollamount="5"
scrolldelay="35"
width="100%"
style="color:#f1c40f;font-size:17px;">
Events Schedule
</marquee>
</div>

<p style="text-align:left;margin:5px 0 3px 0;">
<strong>
<span style="font-size:20px;">&middot; </span>
</strong>
<strong
class="schedule-text"
style="font-size:13px;color:#aaaaaa;">
Elite Saturday
</strong>
</p>

<p
class="schedule-text"
style="
text-align:left;
font-size:13px;
color:#aaaaaa;
margin:3px 0;
">
Every Saturday - 18:00 UTC
</p>

<p
class="schedule-text"
style="
text-align:left;
font-size:13px;
color:#aaaaaa;
margin:3px 0;
">
10+0 Swiss | 3 rounds
</p>

<p style="text-align:left;margin:4px 0;">
<strong>
<span style="font-size:20px;">&middot; </span>
</strong>
<strong
class="schedule-text"
style="font-size:13px;color:#aaaaaa;">
More to come...
</strong>
</p>

<div
style="
margin-top:6px;
padding-top:6px;
border-top:1px solid rgba(241,196,15,.25);
text-align:center;
min-height:35px;
">

<div
id="countdownStart"
style="
display:block;
font-size:12px;
font-weight:600;
color:#f1c40f;
cursor:pointer;
padding:4px 0;
text-shadow:0 0 8px rgba(241,196,15,.35);
">
CLICK TO SHOW COUNTDOWN
</div>

<div
id="countdownLabel"
style="
display:none;
font-size:11px;
font-weight:bold;
color:#f1c40f;
letter-spacing:1px;
margin-bottom:2px;
text-shadow:0 0 8px rgba(241,196,15,.35);
">
NEXT EVENT IN
</div>

<div
id="eliteCountdown"
style="
display:none;
font-size:15px;
font-weight:600;
color:#f1c40f;
letter-spacing:.5px;
text-shadow:0 0 8px rgba(241,196,15,.35);
padding:2px 0 4px;
">
5d&nbsp;&nbsp;08h&nbsp;&nbsp;15m&nbsp;&nbsp;58s
</div>

<div
id="eliteMusicControl"
data-state="on"
style="
display:none;
font-size:11px;
font-weight:600;
color:#f1c40f;
cursor:pointer;
padding:2px 0 4px;
text-shadow:0 0 8px rgba(241,196,15,.35);
">
🎵 MUSIC ON
</div>

</div>
</div>
</div>

<script>

var TRACKER =
'https://script.google.com/macros/s/AKfycbx9Qkt5oxRWXaXNLy_bsxlfsXgvsU2BQvRzPVJo7funf3P_Lw2dyzbW_TUx9GPNpZ_hBA/exec';


/* =========================
   VISITOR ID
========================= */

function getVisitorId(){

    var id =
    localStorage.getItem(
        'elite_visitor_id'
    );

    if(!id){

        id =
        'v_' +
        Math.random()
        .toString(36)
        .slice(2) +
        Date.now();

        localStorage.setItem(
            'elite_visitor_id',
            id
        );
    }

    return id;
}


/* =========================
   ANALYTICS
========================= */

function track(eventName){

    try{

        var img =
        new Image();

        img.src =
        TRACKER +
        '?event=' +
        encodeURIComponent(
            eventName
        ) +
        '&visitor_id=' +
        encodeURIComponent(
            getVisitorId()
        );

    }catch(e){}

}


/* =========================
   SEEN
========================= */

track('seen');


/* =========================
   HOVER
========================= */

var card =
document.getElementById(
    'eliteCard'
);

var marqueeEl =
card.querySelector(
    'marquee'
);


card.addEventListener(
'mouseover',
function(){

    card.style.transform =
    'scale(1.03)';

    card.style.boxShadow =
    '0 0 25px #00ffff';

    if(marqueeEl)
        marqueeEl.stop();

    card
    .querySelectorAll(
        '.schedule-text'
    )
    .forEach(
    function(e){

        e.style.color =
        '#ffffff';

        e.style.fontSize =
        '14px';

    });

});


card.addEventListener(
'mouseout',
function(){

    card.style.transform =
    'scale(1)';

    card.style.boxShadow =
    '0 0 15px #00ffff';

    if(marqueeEl)
        marqueeEl.start();

    card
    .querySelectorAll(
        '.schedule-text'
    )
    .forEach(
    function(e){

        e.style.color =
        '#aaaaaa';

        e.style.fontSize =
        '13px';

    });

});


/* =========================
   MUSIC
========================= */

var pl = [

'https://raw.githubusercontent.com/crazymindset/Elites-Corner/main/GamingMusicForStreaming-ezgif.com-mp4-to-mp3-converter.mp3',

'https://raw.githubusercontent.com/crazymindset/Elites-Corner/main/HipHopLoFiStreamingMusic-ezgif.com-mp4-to-mp3-converter.mp3',

'https://raw.githubusercontent.com/crazymindset/Elites-Corner/main/LoFiGameStreamingMusic-ezgif.com-mp4-to-mp3-converter.mp3',

'https://raw.githubusercontent.com/crazymindset/Elites-Corner/main/spacewalk.mp3'

];


var audioEl =
document.getElementById(
    'eliteAudioPlayer'
);


audioEl.addEventListener(
'ended',
function(){

    try{

        var i =
        (
            parseInt(
                audioEl.getAttribute(
                    'data-idx'
                ),
                10
            ) + 1
        ) % pl.length;

        audioEl.setAttribute(
            'data-idx',
            i
        );

        audioEl.src =
        pl[i];

        audioEl.play();

    }catch(e){}

});


/* =========================
   GLOW
========================= */

var glowLayer =
document.getElementById(
    'glassGlowLayer'
);


function spawnGlassGlow(){

    if(!glowLayer)
        return;

    var blob =
    document.createElement(
        'div'
    );

    var size =
    100 +
    Math.random() * 120;


    var gradients = {

        cyan:
        'rgba(34,211,238,.5)',

        violet:
        'rgba(167,139,250,.5)',

        pink:
        'rgba(244,114,182,.4)'

    };


    var keys =
    Object.keys(
        gradients
    );


    var chosen =
    keys[
        Math.floor(
            Math.random() *
            keys.length
        )
    ];


    var driftX =
    Math.random() * 40 - 20;


    var driftY =
    Math.random() * 40 - 20;


    blob.style.cssText =

        'position:absolute;' +

        'width:' +
        size +
        'px;' +

        'height:' +
        size +
        'px;' +

        'left:' +
        Math.random() * 80 +
        '%;' +

        'top:' +
        Math.random() * 80 +
        '%;' +

        'border-radius:50%;' +

        'background:radial-gradient(circle,' +
        gradients[chosen] +
        ',transparent 70%);' +

        'filter:blur(25px);' +

        'opacity:0;' +

        'transform:scale(.5);' +

        'transition:opacity 4s ease,transform 9s cubic-bezier(.2,.6,.4,1);';


    glowLayer.appendChild(
        blob
    );


    setTimeout(
    function(){

        blob.style.opacity =
        '.70';

        blob.style.transform =
        'scale(1.4) translate(' +
        driftX +
        'px,' +
        driftY +
        'px)';

    },
    50
    );


    setTimeout(
    function(){

        blob.style.opacity =
        '0';

    },
    6000
    );


    setTimeout(
    function(){

        blob.remove();

    },
    10000
    );

}


setInterval(
    spawnGlassGlow,
    2400
);

spawnGlassGlow();


/* =========================
   COUNTDOWN + CLICK
========================= */

document
.getElementById(
    'countdownStart'
)
.addEventListener(
'click',
function(){

    track('click');


    var button =
    this;


    var countdown =
    document.getElementById(
        'eliteCountdown'
    );


    var label =
    document.getElementById(
        'countdownLabel'
    );


    button.style.display =
    'none';

    label.style.display =
    'block';

    countdown.style.display =
    'block';


    function updateCountdown(){

        var now =
        new Date();


        var day =
        now.getUTCDay();


        var daysUntil =
        (6 - day + 7) % 7;


        var target =
        new Date(
            Date.UTC(

                now.getUTCFullYear(),

                now.getUTCMonth(),

                now.getUTCDate()
                +
                daysUntil,

                18,
                0,
                0
            )
        );


        if(
            day === 6 &&
            now >= target
        ){

            target.setUTCDate(
                target.getUTCDate() + 7
            );

        }


        var diff =
        target - now;


        var total =
        Math.floor(
            diff / 1000
        );


        var days =
        Math.floor(
            total / 86400
        );


        total %= 86400;


        var hours =
        Math.floor(
            total / 3600
        );


        total %= 3600;


        var minutes =
        Math.floor(
            total / 60
        );


        var seconds =
        total % 60;


        countdown.innerHTML =

        days +
        'd&nbsp;&nbsp;' +

        String(hours)
        .padStart(2,'0') +

        'h&nbsp;&nbsp;' +

        String(minutes)
        .padStart(2,'0') +

        'm&nbsp;&nbsp;' +

        String(seconds)
        .padStart(2,'0') +

        's';

    }


    updateCountdown();


    setInterval(
        updateCountdown,
        1000
    );


    var musicBtn =
    document.getElementById(
        'eliteMusicControl'
    );


    if(musicBtn)
        musicBtn.style.display =
        'block';


    audioEl.setAttribute(
        'data-idx',
        '0'
    );


    audioEl.src =
    pl[0];


    audioEl.play();

});


/* =========================
   MUSIC BUTTON
========================= */

document
.getElementById(
    'eliteMusicControl'
)
.addEventListener(
'click',
function(){

    var c =
    this;


    if(
        c.getAttribute(
            'data-state'
        ) === 'on'
    ){

        c.setAttribute(
            'data-state',
            'off'
        );

        c.innerHTML =
        '🔇 MUSIC OFF';

        audioEl.pause();

    }else{

        c.setAttribute(
            'data-state',
            'on'
        );

        c.innerHTML =
        '🎵 MUSIC ON';

        audioEl.play();

    }

});

</script>

</body>
</html>
